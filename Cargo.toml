[package]
name = "devdeck"
version = "0.2.0"
edition = "2021"
description = "A fast terminal repository explorer with live previews."
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
fuzzy-matcher = "0.3"
notify = "6"
portable-pty = "0.8"
pulldown-cmark = "0.9"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
shellexpand = "3"
shell-words = "1"
syntect = "5"
thiserror = "1"
toml = "0.8"
tui-term = "0.2"
unicode-width = "0.1"
vt100 = "0.15"

[dev-dependencies]
tempfile = "3"
